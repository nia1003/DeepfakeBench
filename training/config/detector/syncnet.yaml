pretrained: null  # path to joonson/syncnet_python weights; null = train from scratch
model_name: syncnet
backbone_name: null

# Dataset — requires FakeAVCeleb (audio-visual) for meaningful training
train_dataset: [FakeAVCeleb]
test_dataset: [FakeAVCeleb]
compression: c23
train_batchSize: 8
test_batchSize: 8
workers: 4

# Use 5 consecutive frames per clip (SyncNet standard window)
frame_num: {train: 5, test: 5}
video_mode: true
clip_size: 5
resolution: 224

with_mask: false
with_landmark: false

# Audio modality — must be true for SyncNetDetector
with_audio: true
audio_cache_npz: true

loss_func: cross_entropy
optimizer:
  type: adam
  adam:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false

nEpochs: 30
lr_scheduler: null
start_epoch: 0
save_epoch: 5
rec_iter: 100
metric_scoring: auc
manualSeed: 1024

cuda: true
cudnn: true
save_ckpt: true
save_feat: false

rgb_dir: /datasets
lmdb: false
dataset_json_folder: preprocessing/dataset_json_v3
log_dir: ./logs/training/syncnet/

use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.3
  rotate_limit: [-10, 10]
  blur_prob: 0.3
  blur_limit: [3, 7]
  brightness_prob: 0.3
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]
